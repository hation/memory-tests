# syslinux-sol.cfg —— SOL 自动化引导 U 盘配置模板
# 用途：把 Memtest86+ 做成"插入即测、测完自动重启回系统、日志走串口(SOL)"的引导 U 盘，
#       供 SOL 方式批量验收使用（配合编排器 -BootMethod SOL 抓 MTLOG）。
#
# 制作方法（一次性）：
#   1. 准备一块 FAT32 U 盘
#   2. 把 memtest.iso 里的文件解压到 U 盘根目录（含 memtest 内核）
#   3. 用本模板覆盖 U 盘根目录的 syslinux.cfg（或用 syslinux.exe 写入引导扇区）
#   4. 确认 U 盘根目录有内核文件（mt86p_900_x86_64 或 mt86plus，以实际解压结果为准）
#   5. 服务器从该 U 盘引导，Memtest86+ 自动启动并输出 MTLOG 到串口
#
# 关键：APPEND 一行必须包含 log= 与 maxpasses=（log 模式才会自动重启）
DEFAULT mt86plus

LABEL mt86plus
  KERNEL mt86p_900_x86_64
  APPEND log=ttyS0,115200 maxpasses=4

# 快速筛选版（只跑前几个测试，1 轮）
LABEL mt86plus_quick
  KERNEL mt86p_900_x86_64
  APPEND log=ttyS0,115200 maxpasses=1 testlist=0,1,2,3,4,5,6,7,8

# 不输出日志（手动模式，配合 F1→6 保存报告到 USB）
LABEL mt86plus_manual
  KERNEL mt86p_900_x86_64
  APPEND

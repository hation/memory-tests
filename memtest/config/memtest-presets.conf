# Memtest SOL 引导菜单预设（菜单按耗时升序排列：快筛/低轮在上，长压/交互在下）
timeout=20
default=1轮快筛
preset.1轮快筛.title=Memtest86+ 1轮快筛（SOL）
preset.1轮快筛.cmdline=log=ttyS0,115200 maxpasses=1 testlist=0,1,2,3,4,5,6,7,8 ecc
preset.1轮全项.title=Memtest86+ 1轮全项（SOL）
preset.1轮全项.cmdline=log=ttyS0,115200 maxpasses=1 ecc
preset.2轮快筛.title=Memtest86+ 2轮快筛（SOL）
preset.2轮快筛.cmdline=log=ttyS0,115200 maxpasses=2 testlist=0,1,2,3,4,5,6,7,8 ecc
preset.2轮全项.title=Memtest86+ 2轮全项（SOL）
preset.2轮全项.cmdline=log=ttyS0,115200 maxpasses=2 ecc
preset.4轮快筛.title=Memtest86+ 4轮快筛（SOL）
preset.4轮快筛.cmdline=log=ttyS0,115200 maxpasses=4 testlist=0,1,2,3,4,5,6,7,8 ecc
preset.4轮全项.title=Memtest86+ 4轮全项（SOL）
preset.4轮全项.cmdline=log=ttyS0,115200 maxpasses=4 ecc
preset.72hORT.title=Memtest86+ 72h ORT 无限轮（SOL）
preset.72hORT.cmdline=log=ttyS0,115200 ecc
preset.交互.title=Memtest86+ 交互界面（无串口日志）
preset.交互.cmdline=nomch

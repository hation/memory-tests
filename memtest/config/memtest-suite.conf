# ============================================================
# Run-MemtestSuite 默认参数配置（config/memtest-suite.conf）
# 优先级：命令行显式参数 > 本配置 > 脚本内置默认值。
# 改此文件即生效（脚本每次启动读取）；无需重制 ISO。
# 密码不放明文：BMC 密码仍由管道/交互输入。
# 注意：本格式注释须独占整行（# 开头）；行尾注释会被当值解析，勿用。
# ============================================================

# ---- 引导方式（SOL | Serial | USB | EFI）----
BOOT_METHOD=SOL

# ---- BMC 连接（SOL 方式）----
BMC_HOST=10.0.0.10
BMC_USER=root

# ---- Memtest 参数 ----
# 轮数（0=不限）
MAX_PASSES=4
# 测试列表，如 0,1,2,3；空=全部
TEST_LIST=
SERIAL_PARAM=ttyS0,115200

# ---- 监控 / 附加 ----
# 1=开启 ECC/WHEA 监控
MONITOR_ECC=1
# 1=开启 IPMI 温度监控（仅 SOL 方式）
MONITOR_TEMP=1
# 断电-上电循环次数（需 CONFIRM_SWITCH；先实测 power cycle 再启用）
RESTART_LOOP=0
# 1=自动确认引导/重启/断电操作
CONFIRM_SWITCH=1
# ORT 老化上限时长（分钟，0=不限；72h 老化建议 4320）
MAX_MINUTES=0
# 老化温度上限（摄氏度，超过视为异常）
TEMP_LIMIT_C=85
# 温度/运行状态采集间隔（分钟）
TEMP_INTERVAL_MIN=60
# ORT 前缓冲（分钟，先跑一轮完整项再开始计时）
ORT_BUFFER_MIN=10
# 最长无进度间隔（分钟，超时判定卡死）
ORT_MAX_GAP_MIN=30

# ---- 识别 / 输出 ----
# 预期清单路径（如 config\expected.example.csv）
EXPECTED_CSV=
# 输出目录（默认 <包根>\results\）
LOG_PATH=
# ipmitool 路径（默认自动发现内置版）
IPMI_TOOL=
